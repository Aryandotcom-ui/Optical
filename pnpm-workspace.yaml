packages:
  - apps/*
  - packages/*
  - scripts

# Both ship prebuilt native binaries; their install scripts are only fallbacks.
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  # Prisma 7 runs without native engines; its install script only checks for them.
  - prisma
  # Optional MessagePack speed-up for BullMQ; the pure JavaScript fallback is used.
  - msgpackr-extract

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

# Security patches for transitive dependencies of the Prisma CLI, which pins
# vulnerable versions (GHSA-3f6p-5ww8-9rcr, GHSA-rgwj-5xj2-c3m3,
# GHSA-ggr8-5vv4-36mx). Remove once Prisma ships patched pins.
overrides:
  deepmerge-ts: ^8.0.2
  mysql2: ^3.24.5
patchedDependencies:
  '@mediapipe/tasks-vision@1.0.1': patches/@mediapipe__tasks-vision@1.0.1.patch
