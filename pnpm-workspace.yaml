packages:
  - apps/*
  - packages/*
  - scripts

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

# Both ship prebuilt native binaries; their install scripts are only fallbacks.
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'

# Security patches for transitive dependencies of the Prisma CLI, which pins
# vulnerable versions (GHSA-3f6p-5ww8-9rcr, GHSA-rgwj-5xj2-c3m3,
# GHSA-ggr8-5vv4-36mx). Remove once Prisma ships patched pins.
overrides:
  mysql2: ^3.24.5
  deepmerge-ts: ^8.0.2
